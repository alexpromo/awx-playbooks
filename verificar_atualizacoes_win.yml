---
- name: Verificar Atualizações de Aplicativos
  hosts: all
  gather_facts: no
  tasks:
    - name: Executar Winget limpo via PowerShell
      ansible.windows.win_shell: |
        # Arruma os acentos (UTF-8) para o padrão Brasileiro
        $OutputEncoding = [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
        
        $saida = cmd.exe /c "echo Y | winget upgrade 2>&1"
        $resultadoFinal = @()
        
        foreach ($linha in ($saida -split "`r`n")) {
            $linha = $linha.Trim()
            if ([string]::IsNullOrWhiteSpace($linha)) { continue }
            if ($linha -match '█|▒' -or $linha -match '^[-|/\\]$') { continue }
            if ($linha -match 'Terms of Transaction|aka.ms|região geográfica|Você concorda|A fonte.*requer|0x8a15000f|msstore') { continue }
            $resultadoFinal += $linha
        }
        
        if ($resultadoFinal.Count -le 3) {
            Write-Output "Nenhum aplicativo precisa de atualização no momento."
        } else {
            $resultadoFinal -join "`n" | Write-Output
        }
      register: winget_result
      failed_when: false

    - name: Exibir lista no log do AWX
      debug:
        msg: "{{ winget_result.stdout_lines }}"

    - name: Enviar lista para o campo Notas do Zabbix
      delegate_to: localhost
      ansible.builtin.uri:
        url: "http://192.168.1.14/api_jsonrpc.php"
        method: POST
        headers:
          Content-Type: "application/json"
          Authorization: "Bearer cfbf448e275112250c7fe06ef9e84505fe5ea46b880cc3e46c7671267d5cb432"
        body_format: json
        body:
          jsonrpc: "2.0"
          method: "host.update"
          params:
            hostid: "{{ zbx_hostid }}"
            inventory_mode: 0
            inventory:
              notes: "ATUALIZAÇÕES DISPONÍVEIS:\n{{ winget_result.stdout }}"
          id: 1
      ignore_errors: yes
