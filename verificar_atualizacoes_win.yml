---
- name: Verificar Atualizações (Apenas Listar)
  hosts: all
  gather_facts: no
  tasks:
    - name: Consultar lista de atualizações pendentes
      ansible.windows.win_shell: |
        # --accept-source-agreements: Aceita os termos da Microsoft silenciosamente
        # O comando 'winget upgrade' sozinho APENAS EXIBE a tabela, NÃO ATUALIZA.
        winget upgrade --accept-source-agreements --accept-package-agreements | Out-String
      register: winget_result
      # Ignoramos erro se não houver atualizações (o winget retorna erro 1 se estiver tudo ok)
      failed_when: false 

    - name: Exibir lista no log do AWX
      debug:
        msg: "{{ winget_result.stdout_lines }}"

    - name: Enviar lista para o campo Notas do Zabbix
      delegate_to: localhost
      ansible.builtin.uri:
        url: "http://192.168.1.14/api_jsonrpc.php"
        method: POST
        headers:
          Content-Type: "application/json"
          Authorization: "Bearer cfbf448e275112250c7fe06ef9e84505fe5ea46b880cc3e46c7671267d5cb432"
        body_format: json
        body:
          jsonrpc: "2.0"
          method: "host.update"
          params:
            hostid: "{{ zbx_hostid }}"
            inventory_mode: 0
            inventory:
              # Salva a tabela de "O que precisa atualizar" nas Notas
              notes: "LISTA DE ATUALIZAÇÕES DISPONÍVEIS:\n{{ winget_result.stdout }}"
          id: 1
      ignore_errors: yes
