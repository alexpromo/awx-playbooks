---
- name: Verificar Atualizações de Aplicativos
  hosts: all
  gather_facts: no
  tasks:
    - name: Executar Winget ignorando bloqueios da Microsoft Store
      ansible.windows.win_shell: |
        # 1. Remove a Microsoft Store da busca (Para de pedir Região e Contratos)
        winget source remove msstore 2>$null
        
        # 2. Baixa o banco de dados oficial (Cura o erro 0x8a15000f de dados ausentes)
        winget source update --name winget --accept-source-agreements 2>$null
        
        # 3. Lista as atualizações pendentes de forma limpa
        winget upgrade --accept-source-agreements --accept-package-agreements | Out-String
      register: winget_result
      failed_when: false 

    - name: Exibir lista no log do AWX
      debug:
        msg: "{{ winget_result.stdout_lines }}"

    - name: Enviar lista para o campo Notas do Zabbix
      delegate_to: localhost
      ansible.builtin.uri:
        url: "http://192.168.1.14/api_jsonrpc.php"
        method: POST
        headers:
          Content-Type: "application/json"
          Authorization: "Bearer cfbf448e275112250c7fe06ef9e84505fe5ea46b880cc3e46c7671267d5cb432"
        body_format: json
        body:
          jsonrpc: "2.0"
          method: "host.update"
          params:
            hostid: "{{ zbx_hostid }}"
            inventory_mode: 0
            inventory:
              notes: "ATUALIZAÇÕES DE APPS DISPONÍVEIS:\n{{ winget_result.stdout }}"
          id: 1
      ignore_errors: yes
