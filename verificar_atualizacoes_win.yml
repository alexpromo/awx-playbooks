---
- name: Verificar Atualizações de Aplicativos
  hosts: all
  gather_facts: no
  tasks:
    - name: Rodar Winget como SYSTEM via Tarefa Agendada para burlar o WinRM
      ansible.windows.win_shell: |
        $taskName = "WingetAnsibleUpdateCheck"
        $outPath = "C:\Windows\Temp\winget_out.txt"
        if (Test-Path $outPath) { Remove-Item $outPath -Force }

        # Cria a ação mandando o resultado para um arquivo de texto
        $action = New-ScheduledTaskAction -Execute "cmd.exe" -Argument "/c winget upgrade --accept-source-agreements --accept-package-agreements > $outPath"
        
        # Define que vai rodar como SYSTEM (O usuário mestre, que não tem limites de tela)
        $principal = New-ScheduledTaskPrincipal -UserId "NT AUTHORITY\SYSTEM" -LogonType ServiceAccount -RunLevel Highest
        
        # Cria e inicia a tarefa
        Register-ScheduledTask -TaskName $taskName -Action $action -Principal $principal -Force | Out-Null
        Start-ScheduledTask -TaskName $taskName
        
        # Aguarda o comando terminar (Máximo de 2 minutos)
        $timeout = 120
        while ((Get-ScheduledTask -TaskName $taskName).State -eq 'Running' -and $timeout -gt 0) {
            Start-Sleep -Seconds 2
            $timeout -= 2
        }

        # Deleta a tarefa para não deixar lixo no Windows
        Unregister-ScheduledTask -TaskName $taskName -Confirm:$false | Out-Null

        # Lê o arquivo gerado, limpa as barras de progresso e converte para texto puro
        if (Test-Path $outPath) {
            $linhas = Get-Content $outPath
            # Filtra e remove o lixo visual do Winget
            $linhasLimpas = $linhas | Where-Object { $_ -notmatch '█|▒' -and $_.Trim() -notmatch '^[-|/\\\\]$' }
            
            # Converte a lista em um texto único
            $textoFinal = $linhasLimpas | Out-String
            
            Write-Output $textoFinal.Trim()
        } else {
            Write-Output "Nenhuma atualização encontrada ou Winget não instalado."
        }
      register: winget_result
      failed_when: false

    - name: Exibir lista limpa no log do AWX
      debug:
        msg: "{{ winget_result.stdout_lines }}"

    - name: Enviar lista para o campo Notas do Zabbix
      delegate_to: localhost
      ansible.builtin.uri:
        url: "http://192.168.1.14/api_jsonrpc.php"
        method: POST
        headers:
          Content-Type: "application/json"
          Authorization: "Bearer cfbf448e275112250c7fe06ef9e84505fe5ea46b880cc3e46c7671267d5cb432"
        body_format: json
        body:
          jsonrpc: "2.0"
          method: "host.update"
          params:
            hostid: "{{ zbx_hostid }}"
            inventory_mode: 0
            inventory:
              notes: "ATUALIZAÇÕES DISPONÍVEIS:\n{{ winget_result.stdout }}"
          id: 1
      ignore_errors: yes
