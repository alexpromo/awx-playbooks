---
- name: Verificar Atualizações de Aplicativos
  hosts: all
  gather_facts: no
  tasks:
    - name: Consultar atualizações compatível com todas as versões
      ansible.windows.win_shell: |
        # 1. Remove a Microsoft Store (Resolve o erro de Região)
        winget source remove msstore 2>$null
        
        # 2. Atualiza o banco de dados oficial (Corrigido para não dar erro em versões antigas)
        winget source update --name winget 2>$null
        
        # 3. Executa a busca de atualizações
        $resultado = winget upgrade --accept-source-agreements --accept-package-agreements
        
        # 4. Filtra e remove as barras de progresso do log para ficar limpo
        $resultado_limpo = $resultado | Where-Object { $_ -notmatch '█|▒' }
        $resultado_limpo | Out-String
      register: winget_result
      failed_when: false 

    - name: Exibir lista no log do AWX
      debug:
        msg: "{{ winget_result.stdout_lines }}"

    - name: Enviar lista para o campo Notas do Zabbix
      delegate_to: localhost
      ansible.builtin.uri:
        url: "http://192.168.1.14/api_jsonrpc.php"
        method: POST
        headers:
          Content-Type: "application/json"
          Authorization: "Bearer cfbf448e275112250c7fe06ef9e84505fe5ea46b880cc3e46c7671267d5cb432"
        body_format: json
        body:
          jsonrpc: "2.0"
          method: "host.update"
          params:
            hostid: "{{ zbx_hostid }}"
            inventory_mode: 0
            inventory:
              notes: "ATUALIZAÇÕES DE APPS DISPONÍVEIS:\n{{ winget_result.stdout }}"
          id: 1
      ignore_errors: yes
