---
- name: Verificar Atualizações de Aplicativos
  hosts: all
  gather_facts: no
  tasks:
    - name: Consultar Winget via Tarefa Agendada
      ansible.windows.win_shell: |
        $OutputEncoding = [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
        $taskName = "WingetCheck"
        $outPath = "C:\Windows\Temp\winget_out.txt"
        
        if (Test-Path $outPath) { Remove-Item $outPath -Force }

        # Comando simples sem aspas complicadas
        $cmd = "cmd.exe /c 'echo Y | winget upgrade --accept-source-agreements --accept-package-agreements > $outPath 2>&1'"
        $action = New-ScheduledTaskAction -Execute "powershell.exe" -Argument "-Command $cmd"
        $principal = New-ScheduledTaskPrincipal -UserId "SYSTEM" -LogonType ServiceAccount -RunLevel Highest
        
        Register-ScheduledTask -TaskName $taskName -Action $action -Principal $principal -Force | Out-Null
        Start-ScheduledTask -TaskName $taskName | Out-Null
        
        $timeout = 60
        while ((Get-ScheduledTask -TaskName $taskName).State -eq 'Running' -and $timeout -gt 0) {
            Start-Sleep -Seconds 2
            $timeout -= 2
        }

        Unregister-ScheduledTask -TaskName $taskName -Confirm:$false | Out-Null

        if (Test-Path $outPath) {
            $txt = Get-Content $outPath -Raw
            # Limpa o lixo visual (barras e progresso)
            $txt = $txt -replace '(?m)^.*(█|▒).*$', ''
            $txt = $txt -replace '(?m)^\s*[-|/\\\\]\s*$', ''
            Write-Output $txt.Trim()
        } else {
            Write-Output "Nenhuma atualizacao pendente."
        }
      register: winget_result
      failed_when: false

    - name: Exibir lista no log
      debug:
        msg: "{{ winget_result.stdout_lines }}"

    - name: Atualizar Zabbix
      delegate_to: localhost
      ansible.builtin.uri:
        url: "http://192.168.1.14/api_jsonrpc.php"
        method: POST
        headers:
          Content-Type: "application/json"
          Authorization: "Bearer cfbf448e275112250c7fe06ef9e84505fe5ea46b880cc3e46c7671267d5cb432"
        body_format: json
        body:
          jsonrpc: "2.0"
          method: "host.update"
          params:
            hostid: "{{ zbx_hostid }}"
            inventory_mode: 0
            inventory:
              notes: "ATUALIZACOES DISPONIVEIS:\n{{ winget_result.stdout }}"
          id: 1
      ignore_errors: yes
