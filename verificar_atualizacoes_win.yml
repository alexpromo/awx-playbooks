---
- name: Verificar Atualizações (Apenas Listar)
  hosts: all
  gather_facts: no
  tasks:
    - name: Consultar atualizações apenas no repositório Winget
      ansible.windows.win_shell: |
        # 1. Tenta atualizar a lista de fontes ignorando erros
        winget source update --source winget
        
        # 2. Busca atualizações APENAS na fonte 'winget' para evitar erro de região da msstore
        # Usamos '--source winget' para pular a validação da Microsoft Store
        winget upgrade --source winget --accept-package-agreements --accept-source-agreements | Out-String
      register: winget_result
      failed_when: false 

    - name: Exibir lista no log do AWX
      debug:
        msg: "{{ winget_result.stdout_lines }}"

    - name: Enviar lista para o campo Notas do Zabbix
      delegate_to: localhost
      ansible.builtin.uri:
        url: "http://192.168.1.14/api_jsonrpc.php"
        method: POST
        headers:
          Content-Type: "application/json"
          Authorization: "Bearer cfbf448e275112250c7fe06ef9e84505fe5ea46b880cc3e46c7671267d5cb432"
        body_format: json
        body:
          jsonrpc: "2.0"
          method: "host.update"
          params:
            hostid: "{{ zbx_hostid }}"
            inventory_mode: 0
            inventory:
              notes: "ATUALIZAÇÕES DISPONÍVEIS (Fonte Winget):\n{{ winget_result.stdout }}"
          id: 1
      ignore_errors: yes
