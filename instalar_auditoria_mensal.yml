---
- name: Instalar Auditoria de Software Mensal
  hosts: all
  gather_facts: no
  tasks:
    - name: 1. Criar a pasta C:\service
      ansible.windows.win_file:
        path: 'C:\service'
        state: directory

    - name: 2. Gravar o script PowerShell em C:\service
      ansible.windows.win_copy:
        dest: 'C:\service\VerificarAtualizacoes.ps1'
        content: |
          $OutputEncoding = [System.Text.Encoding]::UTF8
          $ZUrl = "http://192.168.1.14/api_jsonrpc.php"
          $Tok = "cfbf448e275112250c7fe06ef9e84505fe5ea46b880cc3e46c7671267d5cb432"
          
          # Executa o Winget exatamente como testamos no ISE
          $raw = cmd.exe /c "echo Y | winget upgrade 2>&1"
          $linhasLimpas = $raw -split "`r`n" | Where-Object {
              $_.Trim() -ne '' -and
              $_ -notmatch '█|▒' -and 
              $_.Trim() -notmatch '^[-|/\\\\]$' -and 
              $_ -notmatch 'Terms|aka.ms|regiao|concorda|fonte.*requer|0x8a15000f|msstore'
          }
          
          $textoFinal = ($linhasLimpas -join "`r`n") -replace '[^\x20-\x7E\xA0-\xFF\r\n]', ''
          
          if ([string]::IsNullOrWhiteSpace($textoFinal) -or $textoFinal -match "Nenhum pacote") {
              $textoFinal = "Nenhuma atualizacao pendente em $(Get-Date)"
          }

          # Identifica IP Local e pega ID no Zabbix
          $ip = (Get-NetIPAddress -AddressFamily IPv4 | Where-Object { $_.InterfaceAlias -notmatch 'Loopback|Virtual' } | Select-Object -First 1).IPAddress
          $auth = @{ "Authorization" = "Bearer $Tok" }

          $bId = @{ jsonrpc="2.0"; method="host.get"; id=1; params=@{ output=@("hostid"); filter=@{ ip=@($ip) } } } | ConvertTo-Json -Compress
          $res = Invoke-RestMethod -Uri $ZUrl -Method Post -Body $bId -ContentType "application/json; charset=utf-8" -Headers $auth

          # Atualiza Zabbix
          if ($res.result.Count -gt 0) {
              $id = $res.result[0].hostid
              $bUp = @{ jsonrpc="2.0"; method="host.update"; id=2; params=@{ hostid=$id; inventory_mode=0; inventory=@{ notes="RELATORIO MENSAL:`r`n$textoFinal" } } } | ConvertTo-Json -Depth 5 -Compress
              Invoke-RestMethod -Uri $ZUrl -Method Post -Body $bUp -ContentType "application/json; charset=utf-8" -Headers $auth
          }

    - name: 3. Criar Tarefa Agendada usando o usuario do Ansible (Burlando o SYSTEM)
      ansible.windows.win_shell: |
        $taskName = "AuditoriaSoftwareWinget"
        
        # Remove a tarefa se ela já existir
        if (Get-ScheduledTask -TaskName $taskName -ErrorAction SilentlyContinue) {
            Unregister-ScheduledTask -TaskName $taskName -Confirm:$false
        }
        
        $action = New-ScheduledTaskAction -Execute "powershell.exe" -Argument "-ExecutionPolicy Bypass -WindowStyle Hidden -File C:\service\VerificarAtualizacoes.ps1"
        $trigger = New-ScheduledTaskTrigger -Monthly -DaysOfMonth 1 -At "12:00:00"
        
        # A MÁGICA ESTÁ AQUI: Pega o usuário logado e aplica o S4U
        $user = "$env:USERDOMAIN\$env:USERNAME"
        $principal = New-ScheduledTaskPrincipal -UserId $user -LogonType S4U -RunLevel Highest
        
        Register-ScheduledTask -TaskName $taskName -Action $action -Trigger $trigger -Principal $principal -Force

    - name: 4. Mandar o Windows executar a tarefa AGORA para testar
      ansible.windows.win_shell: 'Start-ScheduledTask -TaskName "AuditoriaSoftwareWinget"'
