---
- name: Instalar e Executar Auditoria de Software Mensal
  hosts: all
  gather_facts: no
  tasks:
    - name: 1. Criar a pasta C:\service
      ansible.windows.win_file:
        path: 'C:\service'
        state: directory

    - name: 2. Gravar o script PowerShell em C:\service
      ansible.windows.win_copy:
        dest: 'C:\service\VerificarAtualizacoes.ps1'
        content: |
          $OutputEncoding = [System.Text.Encoding]::UTF8
          $ZabbixUrl = "http://192.168.1.14/api_jsonrpc.php"
          $Token = "cfbf448e275112250c7fe06ef9e84505fe5ea46b880cc3e46c7671267d5cb432"
          
          # Executa Winget e limpa o texto
          $saida = cmd.exe /c "echo Y | winget upgrade 2>&1"
          $linhasLimpas = $saida -split "`r`n" | Where-Object {
              $_.Trim() -ne '' -and
              $_ -notmatch '█|▒' -and 
              $_ -notmatch 'Terms|aka.ms|região|Você concorda|fonte.*requer|0x8a15000f|msstore'
          }
          
          # Remove símbolos estranhos para o Zabbix
          $textoSanitizado = ($linhasLimpas -join "`r`n") -replace '[^\x20-\x7E\xA0-\xFF\r\n]', ''
          if ([string]::IsNullOrWhiteSpace($textoSanitizado) -or $textoSanitizado -match "Nenhum pacote") {
              $textoSanitizado = "Tudo atualizado em $(Get-Date)"
          }

          # Busca ID da máquina no Zabbix pelo IP local
          $localIP = (Get-NetIPAddress -AddressFamily IPv4 | Where-Object { $_.InterfaceAlias -notmatch 'Loopback|Virtual' } | Select-Object -First 1).IPAddress
          $header = @{ "Authorization" = "Bearer $Token" }
          $bodyId = @{ jsonrpc="2.0"; method="host.get"; id=1; params=@{ output=@("hostid"); filter=@{ ip=@($localIP) } } } | ConvertTo-Json
          $resHost = Invoke-RestMethod -Uri $ZabbixUrl -Method Post -Body $bodyId -ContentType "application/json; charset=utf-8" -Headers $header

          # Se achou a máquina, envia o relatório para o campo "Notas"
          if ($resHost.result.Count -gt 0) {
              $hostId = $resHost.result[0].hostid
              $bodyUpdate = @{
                  jsonrpc="2.0"; method="host.update"; id=2;
                  params=@{ hostid=$hostId; inventory_mode=0; inventory=@{ notes="AUDITORIA MENSAL (`n$(Get-Date)):`r`n$textoSanitizado" } }
              } | ConvertTo-Json -Depth 10 -Compress
              Invoke-RestMethod -Uri $ZabbixUrl -Method Post -Body $bodyUpdate -ContentType "application/json; charset=utf-8" -Headers $header
          }

    - name: 3. Agendar para rodar todo dia 01 do mes as 12:00
      community.windows.win_scheduled_task:
        name: AuditoriaSoftwareWinget
        description: 'Verifica atualizacoes todo dia 01 via C:\service'
        actions:
          - execute: powershell.exe
            arguments: '-ExecutionPolicy Bypass -File C:\service\VerificarAtualizacoes.ps1'
        triggers:
          - type: monthly
            start_boundary: '2026-06-01T12:00:00'
            days_of_month: 1
        username: SYSTEM
        run_level: highest
        state: present
        enabled: yes

    - name: 4. Executar agora pela primeira vez
      ansible.windows.win_shell: 'powershell.exe -ExecutionPolicy Bypass -File C:\service\VerificarAtualizacoes.ps1'
