---
- name: Relatório de Softwares Instalados
  hosts: all
  gather_facts: no
  tasks:
    - name: Coletar lista de programas via PowerShell
      ansible.windows.win_shell: |
        Get-ItemProperty HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall\* | 
        Select-Object DisplayName, DisplayVersion | 
        Where-Object { $_.DisplayName -ne $null } | 
        Sort-Object DisplayName | 
        Format-Table -AutoSize
      register: resultado_apps

    - name: Exibir lista de programas no log do AWX
      debug:
        msg: "{{ resultado_apps.stdout_lines }}"

    - name: Salvar resultado em arquivo local (opcional)
      delegate_to: localhost
      ansible.builtin.copy:
        content: "{{ resultado_apps.stdout }}"
        dest: "/tmp/apps_{{ inventory_hostname }}.txt"
