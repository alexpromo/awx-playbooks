---
- name: Auditoria de Apps - Envio Zabbix API 7.2 (Vitória)
  hosts: all
  gather_facts: yes

  vars:
    zabbix_api_url: "http://192.168.1.14:8080/api_jsonrpc.php"
    zabbix_token: "6713921716abfd9f792b28b2559bfa89c42bdb6dcd6b44782eef97988c5c9c81"

  tasks:
    - name: 1. Coletar atualizações no Windows (Texto Limpo)
      ansible.windows.win_shell: |
        $list = winget upgrade --include-unknown | Select-String "available"
        if ($list) { 
            ($list.Line) -join " | " 
        } else { 
            "Tudo atualizado" 
        }
      register: winget_out
      ignore_errors: yes

    - name: 2. Enviar para a API do Zabbix 7.2
      delegate_to: localhost
      ansible.builtin.uri:
        url: "{{ zabbix_api_url }}"
        method: POST
        body_format: json
        headers:
          Authorization: "Bearer {{ zabbix_token }}"
          Content-Type: "application/json-rpc"
        body:
          jsonrpc: "2.0"
          method: "history.push"
          params:
            - host: "{{ ansible_hostname }}" 
              key: "apps.updates.list"
              value: "{{ winget_out.stdout | trim }}"
          id: 1
      register: zabbix_res

    - name: 3. Resposta do Zabbix
      ansible.builtin.debug:
        msg: "Status do envio: {{ zabbix_res.json.result | default(zabbix_res.json.error) }}"
