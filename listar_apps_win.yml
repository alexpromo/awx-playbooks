---
- name: Auditoria de Apps - Salvando no MariaDB
  hosts: all
  gather_facts: yes

  tasks:
    - name: 1. Coletar atualizações no Windows
      ansible.windows.win_shell: |
        $list = winget upgrade --include-unknown | Select-String "available"
        if ($list) { ($list.Line) -join " | " } else { "Tudo atualizado" }
      register: winget_out
      ignore_errors: yes

    - name: 2. Gravar no MariaDB (No Servidor AWX)
      delegate_to: localhost
      ansible.builtin.shell: |
        mysql -u ansible_user -p'SenhaAnsible123' inventario_ti -e \
        "INSERT INTO updates (hostname, ip, apps, visto_em) \
        VALUES ('{{ ansible_hostname }}', '{{ inventory_hostname }}', '{{ winget_out.stdout | trim }}', NOW()) \
        ON DUPLICATE KEY UPDATE apps='{{ winget_out.stdout | trim }}', visto_em=NOW();"
