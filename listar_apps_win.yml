---
- name: Auditoria de Apps - Envio Direto por Nome de Host
  hosts: all
  gather_facts: yes # Isso faz o Ansible perguntar o nome real para o Windows

  vars:
    zabbix_url: "http://192.168.1.14:8080/api_jsonrpc.php"
    zabbix_token: "3626f0dcb324a8ab4c948ea90dccb7c6a934a03e01ea3cc386eae6eca61e3dd8"

  tasks:
    - name: 1. Coletar atualizações no Windows
      ansible.windows.win_shell: |
        $list = winget upgrade --include-unknown | Select-String "available"
        if ($list) { $list | Out-String } else { "Tudo atualizado" }
      register: winget_out
      ignore_errors: yes

    - name: 2. DEBUG - Verificando o nome que o Windows reportou
      ansible.builtin.debug:
        msg: "O IP {{ inventory_hostname }} diz que seu nome de rede é: {{ ansible_hostname }}"

    - name: 3. Enviar para o Zabbix usando o nome do Windows
      delegate_to: localhost
      ansible.builtin.uri:
        url: "{{ zabbix_url }}"
        method: POST
        body_format: json
        body:
          jsonrpc: "2.0"
          method: "history.push"
          params:
            - host: "{{ ansible_hostname }}" # Usa o nome que o Windows acabou de falar
              key: "apps.updates.list"
              value: "{{ winget_out.stdout | default('Sem dados') }}"
          auth: "{{ zabbix_token }}"
          id: 1
      ignore_errors: yes
