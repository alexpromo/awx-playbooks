---
- name: Auditoria Completa de Aplicativos e Atualizacoes
  hosts: all
  gather_facts: no

  tasks:
    - name: Verificar Apps instalados e Versoes disponiveis
      ansible.windows.win_shell: |
        # Força o Winget a listar e formatar como tabela limpa
        winget list --accept-source-agreements | Select-Object -Skip 2 | ForEach-Object {
            if ($_ -match '^(?<Name>.*?)\s+(?<Id>\S+)\s+(?<Version>\S+)\s+(?<Available>\S+)?\s+(?<Source>\S+)?$') {
                [PSCustomObject]@{
                    Nome       = $Matches.Name.Trim()
                    Versao     = $Matches.Version
                    NovaVersao = if ($Matches.Available) { $Matches.Available } else { "Atualizado" }
                    Update     = if ($Matches.Available) { $true } else { $false }
                }
            }
        } | ConvertTo-Json
      register: winget_output

    - name: Criar um dicionario de dados
      ansible.builtin.set_fact:
        meu_inventario_apps: "{{ winget_output.stdout | from_json }}"

    - name: Mostrar no Log quem precisa de update
      ansible.builtin.debug:
        msg: "O App {{ item.Nome }} está na versão {{ item.Versao }} e pode ir para {{ item.NovaVersao }}"
      loop: "{{ meu_inventario_apps }}"
      when: item.Update == true
      loop_control:
        label: "{{ item.Nome }}"
