---
- name: Auditoria de Apps - Arquivo Universal (Garantido)
  hosts: all
  gather_facts: yes

  tasks:
    - name: 1. Coletar atualizações no Windows
      ansible.windows.win_shell: |
        $list = winget upgrade --include-unknown | Select-String "available"
        if ($list) { 
            ($list.Line) -join " | " 
        } else { 
            "Tudo atualizado" 
        }
      register: winget_out
      ignore_errors: yes

    - name: 2. Salvar como Arquivo JSON (Sem precisar de banco de dados)
      delegate_to: localhost
      run_once: yes
      ansible.builtin.shell: |
        # Criamos uma pasta no /tmp (que o AWX sempre tem acesso)
        mkdir -p /tmp/inventario
        
        # Gravamos o resultado do PC diretamente
        cat << 'EOF' > /tmp/inventario/{{ ansible_hostname }}.json
        {
          "hostname": "{{ ansible_hostname }}",
          "ip": "{{ inventory_hostname }}",
          "apps": "{{ winget_out.stdout | trim | default('Sem dados') }}"
        }
        EOF
