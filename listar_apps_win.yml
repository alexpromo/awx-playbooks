---
- name: Auditoria de Apps - Sincronizando com Zabbix por IP
  hosts: all
  gather_facts: no

  # ESTE BLOCO ABAIXO EH O QUE ESTA FALTANDO OU COM ERRO DE ESPACOS
  vars:
    zabbix_url: "http://192.168.1.14:8080/api_jsonrpc.php"
    zabbix_token: "3626f0dcb324a8ab4c948ea90dccb7c6a934a03e01ea3cc386eae6eca61e3dd8"

  tasks:
    - name: Verificar atualizações no Windows via Winget
      ansible.windows.win_shell: |
        $list = winget upgrade --include-unknown | Select-String "available"
        if ($list) { $list | Out-String } else { "Tudo atualizado" }
      register: winget_out
      ignore_errors: yes

    - name: Buscar nome do Host no Zabbix pelo IP
      delegate_to: localhost
      ansible.builtin.uri:
        url: "{{ zabbix_url }}"
        method: POST
        body_format: json
        body:
          jsonrpc: "2.0"
          method: "host.get"
          params:
            filter:
              ip: "{{ inventory_hostname }}"
            output: ["host"]
          auth: "{{ zabbix_token }}"
          id: 1
      register: zabbix_host_search

    - name: Definir nome real do host ou usar IP se nao achar
      ansible.builtin.set_fact:
        zabbix_real_name: "{{ zabbix_host_search.json.result[0].host | default('') }}"

    - name: Enviar dados para o Zabbix
      delegate_to: localhost
      ansible.builtin.uri:
        url: "{{ zabbix_url }}"
        method: POST
        body_format: json
        body:
          jsonrpc: "2.0"
          method: "history.push"
          params:
            - host: "{{ zabbix_real_name }}"
              key: "apps.updates.list"
              value: "{{ winget_out.stdout | default('Erro ao coletar') }}"
          auth: "{{ zabbix_token }}"
          id: 1
      when: zabbix_real_name != ""
