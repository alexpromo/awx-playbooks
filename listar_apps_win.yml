---
- name: Auditoria de Apps - Salvando no MariaDB (AWX Fix)
  hosts: all
  gather_facts: yes

  tasks:
    - name: 1. Coletar atualizações no Windows
      ansible.windows.win_shell: |
        $list = winget upgrade --include-unknown | Select-String "available"
        if ($list) { 
            ($list.Line) -join " | " 
        } else { 
            "Tudo atualizado" 
        }
      register: winget_out
      ignore_errors: yes

    # ESSA É A TAREFA NOVA QUE RESOLVE O ERRO:
    - name: 2. Preparar o AWX (Instalar biblioteca pymysql no contêiner)
      delegate_to: localhost
      ansible.builtin.shell: python3 -m pip install pymysql
      ignore_errors: yes

    - name: 3. Gravar no MariaDB via Python (Conexão Direta)
      delegate_to: localhost
      ansible.builtin.shell: |
        python3 - <<EOF
        import pymysql
        import sys

        # Configurações do Banco
        db_host = "192.168.1.14" # IP do MariaDB
        db_user = "ansible_user"
        db_pass = "SenhaAnsible123"
        db_name = "inventario_ti"

        try:
            conn = pymysql.connect(host=db_host, user=db_user, password=db_pass, database=db_name)
            cursor = conn.cursor()
            
            sql = """INSERT INTO updates (hostname, ip, apps, visto_em) 
                     VALUES (%s, %s, %s, NOW()) 
                     ON DUPLICATE KEY UPDATE apps=%s, visto_em=NOW()"""
            
            hostname = "{{ ansible_hostname }}"
            ip = "{{ inventory_hostname }}"
            apps = """{{ winget_out.stdout | trim | default('Sem dados') }}"""
            
            cursor.execute(sql, (hostname, ip, apps, apps))
            conn.commit()
            conn.close()
            print("Sucesso: Dados gravados no MariaDB")
        except Exception as e:
            print(f"Erro ao gravar no banco: {e}")
            sys.exit(1)
        EOF
      register: db_res

    - name: 4. Verificar resultado final
      ansible.builtin.debug:
        msg: "{{ db_res.stdout }}"
