---
- name: Envio Direto Zabbix Sender
  hosts: all
  gather_facts: yes

  tasks:
    - name: 1. Coletar atualizacoes em texto limpo
      ansible.windows.win_shell: |
        $list = winget upgrade --include-unknown | Select-String "available"
        if ($list) { 
            ($list.Line) -join ", " 
        } else { 
            "Tudo atualizado" 
        }
      register: winget_limpo
      ignore_errors: yes

    - name: 2. Enviar para o Zabbix 
      delegate_to: localhost
      community.zabbix.zabbix_sender:
        server: "192.168.1.14"
        port: 10051
        host: "{{ ansible_hostname }}"
        key: "apps.updates.list"
        value: "{{ winget_limpo.stdout | trim }}"
      ignore_errors: yes
