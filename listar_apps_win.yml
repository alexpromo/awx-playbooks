---
- name: Relatório de Softwares Instalados
  hosts: all
  gather_facts: no
  tasks:
    - name: Coletar lista de programas via PowerShell
      ansible.windows.win_shell: |
        Get-ItemProperty HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall\* | 
        Select-Object DisplayName, DisplayVersion | 
        Where-Object { $_.DisplayName -ne $null } | 
        Sort-Object DisplayName | 
        Format-Table -AutoSize
      register: resultado_apps

    - name: Exibir lista de programas no log do AWX
      debug:
        msg: "{{ resultado_apps.stdout_lines }}"

    - name: Atualizar Inventario no Zabbix via API Direta
      delegate_to: localhost
      ansible.builtin.uri:
        url: "http://192.168.1.14/api_jsonrpc.php"
        method: POST
        headers:
          Content-Type: "application/json"
          Authorization: "Bearer cfbf448e275112250c7fe06ef9e84505fe5ea46b880cc3e46c7671267d5cb432"
        body_format: json
        body:
          jsonrpc: "2.0"
          method: "host.update"
          params:
            hostid: "{{ zbx_hostid }}"
            inventory_mode: 0
            inventory:
              software_full: "{{ resultado_apps.stdout }}"
          id: 1
      ignore_errors: yes
